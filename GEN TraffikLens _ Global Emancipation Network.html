const COMM={plain:{short:'Reported cases tracked here rose over the period. That can reflect more reporting, not just more harm.',standard:'Items tracked rose across the period. Rising counts may reflect stronger detection and reporting capacity, so they should not be read as a direct measure of prevalence.',long:'Items tracked rose across the period. Rising counts may reflect stronger detection and reporting capacity rather than prevalence. Readers should compare against the methodology note, check source dates, and avoid drawing causal conclusions from a single series.'},

function chartSVG(c){const d=SERIES.slice(-c.range),l=MONTHS.slice(-c.range),mx=80,w=560,h=170,bw=w/d.length;
 let g=c.chart=='bar'?d.map((v,i)=>`<rect x="${i*bw+6}" y="${h-v/mx*h}" width="${bw-12}" height="${v/mx*h}" fill="var(--sig)"><title>${l[i]}: ${v}</title></rect>`).join(''):`<polyline fill="none" stroke="var(--sig)" stroke-width="3" points="${d.map((v,i)=>`${i*bw+bw/2},${h-v/mx*h}`).join(' ')}"/>`+d.map((v,i)=>`<circle cx="${i*bw+bw/2}" cy="${h-v/mx*h}" r="4" fill="var(--sig)"/>`).join('');
 return `<svg viewBox="0 0 ${w} ${h+22}" role="img" aria-label="${c.chart} chart of illustrative monthly series" style="width:100%">${g}${l.map((m,i)=>`<text x="${i*bw+bw/2}" y="${h+16}" font-size="11" text-anchor="middle" fill="var(--mut)">${m}</text>`).join('')}</svg>`}
function renderNL(c,r={}){const only=r.only&&r.only!='all'?[r.only]:null,none='<p class="mut">Nothing here yet.</p>',
 list=it=>it.length?`<ul style="list-style:none;padding:0;margin:0">${it.map(x=>`<li style="padding:.55rem 0;border-bottom:1px solid var(--ln)"><a href="${esc(x.u)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b></a><div class="mut">${esc(x.s)}${x.d?' · '+esc(x.d):''}</div></li>`).join('')}</ul>`:none;
 return `<div class="row" style="align-items:baseline"><h2 class="g">${esc(c.title)}</h2>${r.date?`<span class="mut">Published ${esc(r.date)}</span>`:'<span class="tag">Preview</span>'}</div>`+c.sections.filter(s=>!only||s.type==only).map(s=>{const it=s.items||[];let b='';
 if(s.type=='stats'){const ms=S.metricsReg.filter(m=>m.status=='verified');b=ms.length?`<div class="grid">${ms.map(m=>`<div class="card" style="margin:0;border-top:4px solid var(--gold)"><div class="big" style="color:var(--sig)">${esc(m.v)}</div><div><b>${esc(m.l)}</b></div><div class="mut">${esc(m.def)}</div><div class="mut" style="margin-top:.3rem">Published by GEN · <a href="${esc(m.src)}" target="_blank" rel="noopener">source</a> · retrieved ${esc(m.ret)}</div></div>`).join('')}</div><p class="mut">Organizational figures published by Global Emancipation Network. They are not results of GEN TraffikLens.</p>`:none}
 else if(s.type=='chart')b=chartSVG(c)+'<p class="mut">Sample data. Connect a verified source before publishing.</p>';
 else if(s.type=='commentary')b=`<p>${COMM[c.tone][c.length]}</p>`;
 else if(s.type=='impact')b=impactHTML();else if(s.type=='news')b=newsBrief();else b=list(it);
 return `<section class="card"><h3>${esc(s.title)}</h3>${b}${s.type=='news'?'<a href="#news">See all current affairs</a>':''}</section>`}).join('')}

/* ---------- AI interpreter (rule-based demo, no LLM) ---------- */
function interpret(q,c0){const c=clone(c0),d=[],n=[],t=q.toLowerCase(),has=w=>w.some(x=>t.includes(x));
 if(has(['concise','shorter','brief']))c.length='short',d.push('Commentary length → short');
 if(has(['detailed','longer','research edition']))c.length='long',d.push('Commentary length → detailed');
 if(has(['accessible','general audience','plain']))c.tone='plain',d.push('Commentary tone → plain language');
 if(has(['12-month','12 month','year-over-year','year over year']))c.range=12,c.period='Last 12 months',d.push('Chart range → 12 months (year-over-year comparison needs a prior-year series; not available, shown as 12-month trend)');
 if(has(['previous calendar month','last month']))c.period='Previous calendar month',d.push('Reporting period → previous calendar month');
 if(has(['line chart','trend line']))c.chart='line',d.push('Chart type → line');if(has(['bar chart']))c.chart='bar',d.push('Chart type → bar');
 if(has(['source','methodology']))c.showSources=true,d.push('Source and methodology note under every statistic');
 const KW={stats:['statistic','indicator'],chart:['chart','trend'],commentary:['commentary'],news:['legislation','news','policy','research'],resources:['resource','prevention']};
 const m=t.match(/(?:move|put|reorder)[^.]*?(top|first)|(\w[\w ,]*) (?:appear|come) first/);
 if(m||has(['to the top','at the top'])){const hit=Object.keys(KW).filter(k=>KW[k].some(w=>t.includes(w)));const stat=has(['statistic','indicator'])?['stats']:hit;if(stat.length){c.sections.sort((a,b)=>(stat.includes(b.type)?1:0)-(stat.includes(a.type)?1:0));d.push('Moved '+stat.join(', ')+' to the top')}}
 const add=t.match(/add (?:a |an |new )?(.*?)(?: section)?(?: with|$|\.)/);
 if(add&&has(['add '])){const k=Object.keys(KW).find(k=>KW[k].some(w=>add[1].includes(w)));if(k){c.sections.push({id:'s'+Date.now(),type:k,title:add[1].replace(/^./,x=>x.toUpperCase())});d.push('Added section: '+add[1])}else n.push('Can’t add “'+add[1]+'”: no matching component. Supported: stats, chart, commentary, news, resources.')}
 if(has(['email-compatible','send to everyone','publish now','ignore permission','other organization']))n.push('Declined: publishing, permissions, and other organizations’ data can’t be changed by prompts.');
 if(!d.length&&!n.length)n.push('No supported change recognised. Try: “make the commentary more concise”, “add a resources section”, or “move statistics to the top”.');
 return{c,d,n}}

<div class="card"><div class="row"><h3 class="g">Scenarios</h3><button onclick="S.econ.scn.push({id:'e'+now(),name:'New scenario',type:'ngo',billing:'annual',price:0,disc:0,setup:0,grant:0,deliv:0,host:0,ai:0,integ:0,hrs:0,rate:0});save();render()">Add blank scenario</button><button onclick="S.econ.scn.push(...window.exEco());save();render()">Load illustrative examples</button></div>${S.econ.scn.map(ecoCard).join('')||'<p class="mut">No scenarios yet.</p>'}</div>
${S.econ.scn.length>1?`<div class="card"><h3>Comparison</h3><table><tr><th>Scenario</th><th>Annual revenue</th><th>Cost to serve</th><th>Contribution</th><th>Margin</th></tr>${S.econ.scn.map(s=>{const e=econ(s);return `<tr><td>${esc(s.name)}</td><td>${Math.round(e.revenue).toLocaleString()}</td><td>${Math.round(e.cost).toLocaleString()}</td><td>${Math.round(e.contribution).toLocaleString()}</td><td>${e.margin==null?'n/a':rd1(e.margin)+'%'}</td></tr>`}).join('')}</table><p class="mut">Estimates from the assumptions above. Actual contracts and costs are not loaded.</p></div>`:''}`}
function aGov(){const P=S.pricing.draft.packages;return P.length?`<div class="card"><h3>Package governance (required to publish visible prices)</h3><table><tr><th>Package</th><th>Currency</th><th>Effective date</th><th>Source of the price</th></tr>${P.map((k,i)=>`<tr><td>${esc(k.name)}</td><td><input value="${esc(k.currency||'')}" placeholder="e.g. USD" onchange="S.pricing.draft.packages[${i}].currency=this.value;save()"></td><td><input type="date" value="${k.effective||''}" onchange="S.pricing.draft.packages[${i}].effective=this.value;save()"></td><td><input value="${esc(k.source||'')}" placeholder="Who approved it and where recorded" onchange="S.pricing.draft.packages[${i}].source=this.value;save()"></td></tr>`).join('')}</table></div>`:''}

function ctxBanner(){const c=ctxNow();if(!c)return'';if(c.denied)return '<div class="banner" style="background:var(--badbg)">Access denied: that insight isn’t available to your signed-in demo session. Sign in to the relevant dashboard first.</div>';return `<div class="banner" style="background:var(--sigbg)"><b>Investigating:</b> ${esc(c.i.title)} (${PM[c.i.p].n}, illustrative data). Only this insight and its supporting figures are shared with GEN Lens AI. <button onclick="PI.ctx=null;render()">Clear</button></div>`}
function feedbackPage(){return `<h1>Feedback & Support</h1><div class="card"><div class="row"><div class="g"><label>Category</label><select id="fc">${['Technical issue','Broken link','Incorrect or outdated data','Methodology question','Content suggestion','Feature request','Account or access','Other'].map(o=>`<option>${o}</option>`).join('')}</select></div><div class="g"><label>Short title</label><input id="ft"></div></div><label>Description (please don’t include personal experiences or identifying details)</label><textarea id="fd"></textarea><label>Contact email (optional)</label><input id="fe" type="email"><button class="p" style="margin-top:.6rem" onclick="subF()">Submit feedback</button></div><div class="card"><h3>Check a submission</h3><div class="row"><input class="g" id="fl" placeholder="Reference, e.g. GEN-F-12345"><button onclick="lookF()">Look up</button></div><div id="flr"></div></div>`}
function subF(){const t=$('#ft').value.trim(),b=$('#fd').value.trim();if(!t||!b){toast='Add a title and description.';return render()}const r=ref('GEN-F');S.feedback.unshift({r,cat:$('#fc').value,title:t,body:b,email:$('#fe').value,status:'New',owner:'',note:''});log('Feedback '+r+' received');save();toast='Received. Your reference number is <b>'+r+'</b>.';render()}
function lookF(){const f=S.feedback.find(x=>x.r==$('#fl').value.trim());$('#flr').innerHTML=f?`<p>${f.r}: <span class="tag sig">${f.status}</span> ${esc(f.title)}</p>`:'<p class="mut">No submission with that reference.</p>'}
const FRAME=`<div class="card"><h3>How we report impact</h3><div class="grid"><div><b>Reach</b><div class="mut">Agencies, organizations or researchers connected to GEN’s work.</div></div><div><b>Activity and outputs</b><div class="mut">What was produced or delivered, such as records enriched or editions published.</div></div><div><b>Operational outcomes</b><div class="mut">Measured improvements in investigative workflows, such as evidence triage or analyst workload.</div></div><div><b>Mission-level impact</b><div class="mut">Longer-term safeguarding results, reported only with appropriate evidence.</div></div></div><p class="mut">An output is something produced. An outcome is a measured change that resulted. Outputs don’t prove outcomes. No verified operational or mission-level data has been added yet.</p></div>`;
function metrics(){const th=S.threshold,sys=(id,name,v,n,src)=>({id,name,v,n,tier:'Activity and outputs',kind:'Output',d:name+', counted from GEN TraffikLens records.',u:'count',p:'To date',me:'System count of records',li:'Describes platform activity only',src,auth:true});
 const reg=S.metricsReg.map(m=>({id:m.id,name:m.l,v:m.v,n:null,tier:m.tier,kind:m.kind,d:m.def,u:m.u,p:m.p,me:m.me,li:m.li,src:m.src,auth:m.status=='verified',why:'Blocked: not yet verified'}));
 return[...reg,sys('m1','Newsletter editions published',S.versions.length,null,'Publication log'),sys('m2','Public discussion threads',S.threads.filter(t=>t.status=='published').length,S.threads.filter(t=>t.status=='published').length,'Discussion records (count only)'),sys('m3','Feedback submissions received',S.feedback.length,S.feedback.length,'Feedback records (count only)'),sys('m4','Partner inquiries received',S.inquiries.length,S.inquiries.length,'Inquiry records (count only, no identities)'),
 {id:'m6',name:'Prevention referrals reported by a partner',v:22,n:22,tier:'Operational outcomes',kind:'Outcome',d:'Referrals reported by a partner organization (self-reported).',u:'referrals',p:'Not specified',me:'Partner self-report',li:'Self-reported; not independently verified',src:'Sample entry. No partner permission on file',auth:false,why:'Blocked: no partner authorization for external reporting'}].map(m=>({...m,cls:m.tier+' ('+m.kind+')',flag:!m.auth?m.why:(m.n!==null&&m.n<th?`Suppressed: group size ${m.n} is below threshold ${th}`:'')}))}
let rsel={};
function aReceipts(){const M=metrics();return `<h1>Public impact summary</h1><div class="banner">Conservative default: when in doubt, the statistic is not published. Passing these checks does not guarantee anonymity. Human review is still required.</div>${FRAME}
<div class="card"><div class="row"><h3 class="g">1. Select metrics (public mode)</h3><label style="margin:0">Minimum group size <input type="number" min="1" value="${S.threshold}" style="width:80px" onchange="S.threshold=+this.value;save();render()"></label></div><table><tr><th></th><th>Metric and definition</th><th>Value</th><th>Tier</th><th>Source</th><th>Disclosure check</th></tr>${M.map(m=>`<tr><td><input type="checkbox" style="width:auto" aria-label="Include ${esc(m.name)}" ${m.flag?'disabled':''} ${rsel[m.id]&&!m.flag?'checked':''} onchange="rsel['${m.id}']=this.checked"></td><td><b>${esc(m.name)}</b><div class="mut">${esc(m.d)}<br>Unit: ${esc(m.u)} · Period: ${esc(m.p)} · Method: ${esc(m.me)} · Limits: ${esc(m.li)}</div></td><td>${m.flag?'—':esc(m.v)}</td><td><span class="tag">${esc(m.tier)}</span><div class="mut">${m.kind}</div></td><td class="mut">${esc(m.src)}</td><td>${m.flag?`<span class="tag bad">${esc(m.flag)}</span>`:'<span class="tag ok">Passed (needs human review)</span>'}</td></tr>`).join('')}</table>
<label>Commentary (cannot change the numbers)</label><textarea id="rc" placeholder="Explain context and caveats."></textarea><button class="p" style="margin-top:.5rem" onclick="mkR()">Generate draft receipt</button></div>`+S.receipts.map((r,i)=>`<div class="card"><div class="row"><h3 class="g">Receipt ${r.id}</h3><span class="tag ${r.ok?'ok':'warn'}">${r.ok?'Approved by GEN':'Draft: awaiting approval'}</span></div><p class="mut">Period: ${r.at} · Threshold ${r.th}</p><table>${r.rows.map(m=>`<tr><td>${m.name}</td><td><b>${m.v}</b></td><td class="mut">${m.cls}. Source: ${m.src}</td></tr>`).join('')}</table><p>${esc(r.c)||'<i class="mut">No commentary.</i>'}</p><p class="mut">Limits: platform outputs and engagement are not evidence that trafficking was prevented. Excluded: ${r.ex.join('; ')||'none'}.</p>${S.staff&&!r.ok?`<button class="p" onclick="S.receipts[${i}].ok=true;log('Receipt ${r.id} approved');save();render()">Approve for export</button>`:''}${r.ok?`<details><summary>Export preview (CSV)</summary><pre>metric,value,type,source\n${r.rows.map(m=>[m.name,m.v,m.cls,m.src].map(x=>'"'+x+'"').join(',')).join('\n')}</pre></details>`:'<p class="mut">Export is locked until staff approve (turn on Staff mode).</p>'}</div>`).join('')}
function mkR(){const M=metrics(),rows=M.filter(m=>rsel[m.id]&&!m.flag),ex=M.filter(m=>!rsel[m.id]||m.flag).map(m=>m.name+(m.flag?' (flagged)':''));if(!rows.length){toast='Select at least one metric that passes disclosure checks.';return render()}S.receipts.unshift({id:ref('OR'),rows:rows.map(m=>({name:m.name,v:m.v,cls:m.cls,src:m.src+(m.id.length==3?' (published by GEN)':''),d:m.d})),c:$('#rc').value,ex,th:S.threshold,ok:false,at:new Date().toLocaleDateString()});log('Receipt draft created');save();render()}
function impact(){const R=S.receipts.filter(r=>r.ok);return `<h1>Impact</h1><p style="max-width:60ch">Impact summaries from GEN, reviewed and approved before release. Each figure lists its source and what it does and doesn’t show.</p>${FRAME}${relList()}`+(R.length?R.map(r=>`<section class="card"><h3>Report ${r.id} <span class="mut">${r.at}</span></h3><table>${r.rows.map(m=>`<tr><td>${esc(m.name)}</td><td><b>${esc(m.v)}</b></td><td class="mut">${esc(m.cls)}. Source: ${esc(m.src)}</td></tr>`).join('')}</table>${r.c?`<p>${esc(r.c)}</p>`:''}<p class="mut">Activity and engagement figures don’t show that trafficking was prevented.</p></section>`).join(''):'<div class="card"><h3>No reports published yet</h3><p>Impact summaries will appear here once GEN approves them.</p></div>')}
const setM=(i,f,v)=>{S.metricsReg[i][f]=v;save()};
function aMet(){const t=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});return `<div class="card"><p class="mut">Only <b>verified</b> metrics appear on the public site and in receipts. Check each figure against its source, then mark it verified.</p>${S.metricsReg.map((m,i)=>`<div class="card"><div class="row"><b class="g">${esc(m.l)}</b><span class="tag ${m.status=='verified'?'ok':'warn'}">${m.status}</span></div><div class="row"><div class="g"><label>Value</label><input value="${esc(m.v)}" onchange="setM(${i},'v',this.value)"></div><div class="g"><label>Label</label><input value="${esc(m.l)}" onchange="setM(${i},'l',this.value)"></div><div class="g"><label>Source URL</label><input value="${esc(m.src)}" onchange="setM(${i},'src',this.value)"></div></div><label>Definition</label><textarea onchange="setM(${i},'def',this.value)">${esc(m.def)}</textarea><div class="row"><div class="g"><label>Tier</label><select onchange="setM(${i},'tier',this.value)">${['Reach','Activity and outputs','Operational outcomes','Mission-level impact'].map(o=>`<option ${m.tier==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="g"><label>Limitations</label><input value="${esc(m.li)}" onchange="setM(${i},'li',this.value)"></div></div><p class="mut">Retrieved: ${m.ret||'not yet'} · Last verified: ${m.ver||'not yet'}</p><div class="row"><button class="p" onclick="S.metricsReg[${i}].status='verified';S.metricsReg[${i}].ret='${t}';S.metricsReg[${i}].ver='${t}';log('Metric ${m.id} verified');save();render()">Mark verified today</button><button onclick="S.metricsReg[${i}].status='pending';save();render()">Mark pending</button></div></div>`).join('')}<button onclick="S.metricsReg.push({id:'x'+Date.now(),v:'',l:'New metric',def:'',src:'',ret:'',ver:'',status:'pending',tier:'Reach',kind:'Output',u:'',p:'',me:'',li:''});save();render()">Add metric</button></div>`}
function aAI(){return `<div class="card"><label>Additional instructions for the assistant (added to its built-in rules)</label><textarea onchange="S.aiExtra=this.value;save()">${esc(S.aiExtra)}</textarea><p class="mut">The assistant answers only from the approved sources below.</p></div><div class="card"><h3>Approved sources</h3>${kb().concat(Object.keys(S.kbOff).length?[]:[]).map(k=>`<div class="row"><span class="g"><b>${esc(k.t)}</b><div class="mut">${esc(k.x.slice(0,110))}</div></span><button onclick="S.kbOff['${k.id}']=true;save();render()">Turn off</button></div>`).join('')}${Object.keys(S.kbOff).map(id=>`<div class="row"><span class="g mut">Off: ${id}</span><button onclick="delete S.kbOff['${id}'];save();render()">Turn on</button></div>`).join('')}</div><div class="card"><h3>Add a source</h3><div class="row"><input class="g" id="kt" placeholder="Title"><input class="g" id="ku" placeholder="https:// link"></div><label>Text the assistant may use</label><textarea id="kx"></textarea><button class="p" style="margin-top:.5rem" onclick="addKB()">Add source</button></div>`}
function addKB(){const t=$('#kt').value.trim(),u=$('#ku').value.trim(),x=$('#kx').value.trim();if(!t||!x||!/^https:\/\//.test(u)){toast='Add a title, text and an https link.';return render()}S.kbX.push({id:'x'+Date.now(),t,u,x});log('Assistant source added: '+t);save();render()}
function status(){return `<h1>Build notes</h1><div class="card"><h3>Moderation, reports and Impact Receipts</h3><ul><li>Working: configurable moderation rules (block, replace with asterisks, hold, allow), enforced on every new post, reply, edit and resubmission, and re-checked on every page load. Reporting with seven reasons, duplicate prevention, a grouped moderator queue and decisions. Impact Receipt requests with unique links, expiry, revocation, partner form, validation, tracking and CSV export.</li><li>Limit: there is no server in this build. All checks, data and sign-in run in the browser, so a determined person with browser tools could alter their own local data. For production, run the same rules on a server before anything is stored.</li><li>Limit: data lives in this browser only. A partner opening a link on another device cannot reach your requests until a hosted database is added.</li><li>Email is not sent. The Send email button reports that delivery is not configured. To enable it, add a server function that calls your email provider and set: ${EMAIL_CFG.env.join(', ')}. The email draft button opens your own mail app.</li><li>File upload is not supported; partners share https links instead.</li><li>Impact Receipts: requests with defined activity and outcome metrics, partner form with unit checks, correction requests with the original preserved, approval that locks the data, receipt generation from the approved snapshot, valid-only period comparisons, calculated completeness, assurance labels (independent verification only with a named verifier and evidence), internal approval then partner authorization then release, withdrawal, print, HTML and CSV export. Limit: approver names are typed in, not real accounts, and PDF is produced through your browser’s print dialog.</li></ul></div><div class="grid"><div class="card"><h3>Working in this build</h3><ul><li>Three demo Partner Intelligence dashboards with period, scenario and sensitivity controls, comparisons, trends, category breakdowns with small-group suppression, and documented definitions</li><li>Insights engine: deterministic calculations, baseline and z-score checks, targets, sustained-decline checks, related-metric facts, hedged explanations, evidence view, status and notes, follow-up comparison. 22 automated checks cover calculations, scenarios, isolation, pricing, aggregation and links (Studio, Impact metrics tab)</li><li>Investigate this change opens GEN Lens AI with only that insight as context; other partners’ insights are refused</li><li>Pricing economics scenarios (revenue, cost to serve, contribution, margin), framework by partner type, and package governance required before prices are shown</li><li>Briefing impact section from pooled, suppressed, staff-approved indicators</li><li>Current Affairs: nine manually curated articles with publisher, date, access status, search, filters, sort and removal</li></ul></div><div class="card"><h3>Not production-grade</h3><ul><li>The dashboard sign-in is a visible demo gate (password GEN). Production needs server-side accounts, hashed passwords, sessions and role-based access</li><li>All data is synthetic; there are no real partner feeds, no stored historical data and no exports (none implemented, so none offered)</li><li>Insight text comes from rules and templates, not a language model. GEN Lens AI can discuss it when live AI is available</li><li>News is not retrieved automatically. I read excerpts of each article through search; I did not open each page in a browser, and I can’t test links from here</li><li>Pricing inquiries still stay in this browser: there is no tested backend or email workflow</li><li>Moderation and access checks run in the browser only</li><li>Filter-combination disclosure review isn’t implemented</li><li>The shared ChatGPT conversation was unreadable, and “30+ countries” remains unverified</li></ul></div></div>`}
ensureMod();initAI();render();
</script></body></html>
